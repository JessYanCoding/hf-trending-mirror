name: Refresh HF Trending

on:
  schedule:
    # 22:30 UTC（前一天）= 06:30 北京时间。
    # 之前用 00:30 UTC（08:30 CST）+ 30 分钟缓冲，但 GitHub Actions
    # cron 在 UTC 整点高峰能延迟 50+ 分钟，曾把缓冲吃光让下游拿到旧数据。
    # 改成 22:30 UTC 跑（CST 06:30）—— 这个时间段 Actions 调度更准时，
    # 离 9:00 CST 的下游任务有 2.5 小时缓冲，能扛住绝大多数延迟。
    - cron: '30 22 * * *'
  workflow_dispatch:        # Actions 页可手动触发，做首次测试用

permissions:
  contents: write           # 兼容性保留
  issues: write             # 需要写 issue body

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet huggingface_hub requests

      - name: Fetch HF trending
        run: |
          python <<'PY'
          # 直接调 HF 的 HTTP API，不走 huggingface_hub 的高层 wrapper
          # （新版库已经从 list_models() 里移除了 direction 参数，HTTP API 仍接受）
          import requests, json, datetime
          from huggingface_hub import ModelCard

          # 1) 拉 trending 列表
          resp = requests.get(
              'https://huggingface.co/api/models',
              params={
                  'sort': 'trendingScore',
                  'direction': -1,
                  'limit': 15,
                  'full': 'true',
                  'config': 'true',
              },
              timeout=30,
          )
          resp.raise_for_status()
          models = resp.json()

          out = []
          for m in models:
              entry = {
                  'id': m.get('id'),
                  'pipeline_tag': m.get('pipeline_tag'),
                  'downloads': m.get('downloads', 0),
                  'likes': m.get('likes', 0),
                  'last_modified': m.get('lastModified'),
                  'tags': (m.get('tags') or [])[:10],
                  'readme': '',
                  'params_total': None,
              }
              # 参数量（从 safetensors 元数据反推；JSON 里是字典格式）
              try:
                  st = m.get('safetensors') or {}
                  params = st.get('parameters') or {}
                  if isinstance(params, dict) and params:
                      entry['params_total'] = sum(int(v) for v in params.values())
              except Exception as e:
                  entry['params_error'] = str(e)
              # README 前 3500 字符（用 ModelCard 帮我们处理 raw URL 重定向）
              try:
                  card = ModelCard.load(entry['id'])
                  entry['readme'] = (card.content or '')[:3500]
              except Exception as e:
                  entry['readme_error'] = str(e)
              out.append(entry)

          payload = {
              'fetchedAt': datetime.datetime.utcnow().isoformat() + 'Z',
              'models': out,
          }
          with open('trending.json', 'w') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          print(f"wrote {len(out)} models, {sum(len(x['readme']) for x in out)} chars of READMEs")
          PY

      - name: Trim README size to fit in issue body
        # GitHub issue body 上限 65536 字符。15 模型 × ~3000 字符 README 会顶满。
        # 把每个 README 缩到 ~2000，留出安全余量。
        run: |
          python <<'PY'
          import json
          d = json.load(open('trending.json'))
          for m in d['models']:
              m['readme'] = (m.get('readme') or '')[:2000]
          payload = json.dumps(d, ensure_ascii=False, indent=None)
          with open('trending.body.txt', 'w') as f:
              f.write(payload)
          print(f"body size: {len(payload)} chars")
          assert len(payload) < 60000, f"too big: {len(payload)}"
          PY

      - name: Publish to issue body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 找标题以 "trending-data" 开头的 issue。
          # 不用 --search（GitHub 搜索索引会延迟、有时找不到）。
          # 改用 --state all + 本地 jq 过滤，更可靠。
          # 取最小的 number = 第一次创建的那个，保持稳定。
          ISSUE_NUM=$(gh issue list --state all --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("trending-data"))] | sort_by(.number) | .[0].number // empty')

          if [ -z "$ISSUE_NUM" ]; then
            echo "→ No existing tracking issue, creating one..."
            gh issue create \
              --title 'trending-data (auto-updated daily; do not close)' \
              --body-file trending.body.txt
            ISSUE_NUM=$(gh issue list --state all --limit 100 --json number,title \
              --jq '[.[] | select(.title | startswith("trending-data"))] | sort_by(.number) | .[0].number')
          else
            echo "→ Found tracking issue #$ISSUE_NUM"
            # 如果是 closed，先 reopen 再 edit
            STATE=$(gh issue view "$ISSUE_NUM" --json state --jq '.state')
            if [ "$STATE" = "CLOSED" ]; then
              echo "→ Issue is closed, reopening..."
              gh issue reopen "$ISSUE_NUM"
            fi
            echo "→ Updating issue #$ISSUE_NUM body..."
            gh issue edit "$ISSUE_NUM" --body-file trending.body.txt
          fi
          echo ""
          echo "Cowork should fetch:"
          echo "https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE_NUM"
