name: Refresh GitHub Trending

# 与 refresh.yml（HF trending）同一套思路：
#   Actions runner 有完整外网 → 抓实时 github.com/trending → 写进固定 issue body
#   → 下游云端定时任务只需读这个 issue，绕开其环境对 github.com/trending 的 403 / 冻结缓存。

on:
  schedule:
    # 22:40 UTC（前一天）= 06:40 北京时间。
    # 与 HF 任务错开 10 分钟，避免同一分钟并发排队；同样避开 UTC 整点高峰，
    # 离 9:00 CST 的下游任务留 2 小时以上缓冲。
    - cron: '40 22 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Trending window (daily / weekly / monthly)'
        required: false
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: read
  issues: write             # 需要写 issue body

# 手动触发与定时任务撞车时，只保留最新一次，避免两个 job 同时 edit 同一个 issue
concurrency:
  group: github-trending-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 固定 issue 标题前缀。注意不能以 "trending-data" 开头，否则会和 HF 任务的 issue 查找规则冲突
      ISSUE_TITLE_PREFIX: 'github-trending-data'
      # issue body 上限 65536 字符，留安全余量
      ISSUE_BODY_MAX_CHARS: '60000'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Fetch GitHub trending
        env:
          # schedule 触发时 inputs 为空，回落到 daily
          TRENDING_SINCE: ${{ inputs.since || 'daily' }}
          README_MAX_CHARS: '1500'
          # 用于 REST API 拉 README，避免匿名 60 次/小时限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: github_trending.json
        run: python scripts/fetch_github_trending.py

      - name: Shrink payload to fit in issue body
        # 正常 25 仓库 × 1500 字符 README 约 45k，能放下；
        # 万一超限，按比例逐步缩短 README，而不是直接失败。
        run: |
          python <<'PY'
          import json, os
          max_chars = int(os.environ['ISSUE_BODY_MAX_CHARS'])
          data = json.load(open('github_trending.json', encoding='utf-8'))

          def dump():
              text = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
              # 把 < > & ` 转成 JSON 的 \uXXXX 转义：
              #   - 这些字符在 JSON 里只可能出现在字符串内部，替换后 json.loads 结果完全不变；
              #   - body 中不再有任何 HTML 标签，即使下游读的是网页渲染版也不会被吞；
              #   - 没有反引号，README 里的 ``` 无法提前闭合外层代码块。
              for ch, esc in (('<', '\\u003c'), ('>', '\\u003e'), ('&', '\\u0026'), ('`', '\\u0060')):
                  text = text.replace(ch, esc)
              # 用 ```json 代码块包裹：GitHub 网页按代码原样显示，不再做 Markdown/HTML 渲染
              return ''.join(['```json\n', text, '\n```\n'])

          payload = dump()
          readme_limit = 1500
          # 每轮缩短 300 字符，直到放得下或 README 全部清空
          while len(payload) >= max_chars and readme_limit > 0:
              readme_limit = max(0, readme_limit - 300)
              for repo in data['repos']:
                  repo['readme'] = (repo.get('readme') or '')[:readme_limit]
              payload = dump()

          print(f"body size: {len(payload)} chars, readme limit: {readme_limit}")
          assert len(payload) < max_chars, f"too big even without READMEs: {len(payload)}"
          # 自检：按下游的方式（去代码块标记 → json.loads）能还原出同样的数据，否则不发布
          inner = payload.strip().removeprefix('```json').removesuffix('```').strip()
          assert json.loads(inner) == data, "fenced body does not round-trip to original JSON"
          assert '<' not in payload and '`' not in inner, "raw HTML or backtick leaked into body"
          with open('github_trending.body.txt', 'w', encoding='utf-8') as f:
              f.write(payload)
          PY

      - name: Publish to issue body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 与 HF 任务相同：不用 --search（索引有延迟），--state all + 本地 jq 过滤，
          # 取最小 number = 最早创建的那个，保证下游读到的 issue 号稳定。
          find_issue() {
            gh issue list --state all --limit 200 --json number,title \
              --jq "[.[] | select(.title | startswith(\"${ISSUE_TITLE_PREFIX}\"))] | sort_by(.number) | .[0].number // empty"
          }

          ISSUE_NUM=$(find_issue)

          if [ -z "$ISSUE_NUM" ]; then
            echo "→ No existing tracking issue, creating one..."
            gh issue create \
              --title "${ISSUE_TITLE_PREFIX} (auto-updated daily; do not close)" \
              --body-file github_trending.body.txt
            ISSUE_NUM=$(find_issue)
          else
            echo "→ Found tracking issue #$ISSUE_NUM"
            STATE=$(gh issue view "$ISSUE_NUM" --json state --jq '.state')
            if [ "$STATE" = "CLOSED" ]; then
              echo "→ Issue is closed, reopening..."
              gh issue reopen "$ISSUE_NUM"
            fi
            echo "→ Updating issue #$ISSUE_NUM body..."
            gh issue edit "$ISSUE_NUM" --body-file github_trending.body.txt
          fi
          echo ""
          echo "Cowork should fetch:"
          echo "https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE_NUM"
